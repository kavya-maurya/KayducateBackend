name: Deploy Kayducate Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            export NVM_DIR="/root/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd /var/www/html/KayducateBackend

            git stash push -u -m "Auto stash before deployment" || true
            git pull origin main
            git stash pop || true

            npm install

            /root/.nvm/versions/node/v24.18.0/bin/pm2 restart all

            sudo systemctl reload nginx

            echo "✅ Deployment completed successfully."

      # Checkout repository (required to access k6 scripts)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install k6
      - name: Install k6
        run: |
          sudo gpg -k
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      # Smoke Test
      - name: Run Smoke Test
        run: |
          k6 run k6-tests/smoke.js

      # Load Test
      - name: Run Load Test
        run: |
          k6 run k6-tests/load.js

      - name: Send ntfy notification
        if: success()
        run: |
          curl -H "Title: 🚀 Kayducate Backend Deployment" \
               -H "Priority: high" \
               -d "Deployment and k6 tests completed successfully." \
               https://ntfy.sh/kaylynk

      - name: Send failure notification
        if: failure()
        run: |
          curl -H "Title: ❌ Kayducate Backend Deployment Failed" \
               -H "Priority: urgent" \
               -d "Deployment or k6 tests failed. Check the GitHub Actions logs." \
               https://ntfy.sh/kaylynk